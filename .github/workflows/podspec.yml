name: Podspec

on:
  pull_request:
    paths:
      - "MultipleImageView.podspec"
      - "Gemfile.lock"
      - ".github/workflows/podspec.yml"
  push:
    paths:
      - "MultipleImageView.podspec"
      - "Gemfile.lock"
      - ".github/workflows/podspec.yml"

jobs:
  podspec:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up ruby
      uses: ruby/setup-ruby@v1.343.0
      with:
        bundler-cache: true
        ruby-version: "4.0.10"
    
    - name: Lint
      run: bundle exec pod lib lint MultipleImageView.podspec
