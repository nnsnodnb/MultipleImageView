name: Swift build

on: push

jobs:
  build:
     runs-on: xcode-27

     steps:
     - uses: actions/checkout@v7.0.1

     - name: Build
       run: |
         xcodebuild build \
           -scheme MultipleImageView \
           -workspace MultipleImageView.xcworkspace \
           -destination 'generic/platform=iOS Simulator' | xcbeautify --renderer github-actions
